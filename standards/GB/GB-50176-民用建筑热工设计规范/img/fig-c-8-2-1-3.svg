<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 220" width="180" height="220" role="img" aria-labelledby="title desc">
  <title id="title">垂直遮阳光斑形状3</title>
  <desc id="desc">左上部为光照区，右下部为阴影区。</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#000" stroke-width="2"/>
    </pattern>
  </defs>
  <rect x="2" y="2" width="176" height="216" fill="#fff"/>
  <polygon points="2,82 178,2 178,218 2,218" fill="url(#hatch)"/>
  <text x="58" y="38" text-anchor="middle" font-family="SimSun, Songti SC, Noto Serif CJK SC, serif" font-size="25" font-weight="700">光照区</text>
  <rect x="52" y="122" width="84" height="44" fill="#fff"/>
  <text x="94" y="153" text-anchor="middle" font-family="SimSun, Songti SC, Noto Serif CJK SC, serif" font-size="25" font-weight="700">阴影区</text>
  <rect x="2" y="2" width="176" height="216" fill="none" stroke="#000" stroke-width="3"/>
  <line x1="2" y1="82" x2="178" y2="2" stroke="#000" stroke-width="3"/>
</svg>
