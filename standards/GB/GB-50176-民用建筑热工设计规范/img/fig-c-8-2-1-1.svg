<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 220" width="180" height="220" role="img" aria-labelledby="title desc">
  <title id="title">垂直遮阳光斑形状1</title>
  <desc id="desc">左侧为光照区，右侧为阴影区，阴影区上边为斜边。</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#000" stroke-width="2"/>
    </pattern>
  </defs>
  <rect x="2" y="2" width="176" height="216" fill="#fff"/>
  <polygon points="98,66 178,2 178,218 98,218" fill="url(#hatch)"/>
  <text x="46" y="40" text-anchor="middle" font-family="SimSun, Songti SC, Noto Serif CJK SC, serif" font-size="25" font-weight="700">光照区</text>
  <rect x="112" y="116" width="58" height="44" fill="#fff"/>
  <text x="141" y="147" text-anchor="middle" font-family="SimSun, Songti SC, Noto Serif CJK SC, serif" font-size="25" font-weight="700">阴影区</text>
  <rect x="2" y="2" width="176" height="216" fill="none" stroke="#000" stroke-width="3"/>
  <polyline points="98,218 98,66 178,2" fill="none" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
</svg>
