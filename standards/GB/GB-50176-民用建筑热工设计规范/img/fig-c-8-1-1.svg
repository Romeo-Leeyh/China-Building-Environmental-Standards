<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 220" width="180" height="220" role="img" aria-labelledby="title desc">
  <title id="title">水平遮阳光斑形状1</title>
  <desc id="desc">上部为阴影区，下部为光照区，阴影区右侧为斜边。</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#000" stroke-width="2"/>
    </pattern>
  </defs>
  <rect x="2" y="2" width="176" height="216" fill="#fff"/>
  <polygon points="2,2 178,2 122,94 2,94" fill="url(#hatch)"/>
  <polygon points="2,94 122,94 178,2 178,218 2,218" fill="#fff"/>
  <polygon points="2,2 178,2 122,94 2,94" fill="url(#hatch)"/>
  <rect x="30" y="42" width="92" height="38" fill="#fff"/>
  <text x="76" y="70" text-anchor="middle" font-family="SimSun, Songti SC, Noto Serif CJK SC, serif" font-size="28" font-weight="700">阴影区</text>
  <text x="78" y="166" text-anchor="middle" font-family="SimSun, Songti SC, Noto Serif CJK SC, serif" font-size="28" font-weight="700">光照区</text>
  <rect x="2" y="2" width="176" height="216" fill="none" stroke="#000" stroke-width="3"/>
  <polyline points="2,94 122,94 178,2" fill="none" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
</svg>
